services:
  - type: web
    name: leadpulse-meta-webhook
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: VERIFY_TOKEN
        value: leadpulse_meta_verify_2026
      - key: PAGE_ACCESS_TOKEN
        sync: false
